name: core-tests

# Run the pure-JVM `:core` unit tests on every push / PR. They take <5s and would have caught
# all of the pre-existing compile + threading bugs documented in Doc/13 §1.7.
#
# We don't build the Android APKs in CI yet — that would need an Android SDK in the runner and
# the agent dex flow on top. Easy follow-up once we want it.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: false

      - name: Run :core:test
        working-directory: app-project
        run: ./gradlew :core:test --no-daemon

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: app-project/core/build/reports/tests/test/

name: build-apks

# Builds release APKs for both flavors (rokid + rayneo) on every push to main, every PR, and
# every git tag matching `v*`. Debug APKs are NOT produced by CI — debug is a dev-machine
# concern (you want logcat verbose locally) and shipping debug binaries from CI just confuses
# the Releases page (audit-2026-05-13p). Use `./gradlew :app:assemble*Debug` locally if you
# need them.
#
# Outputs land in two places:
#
#   1. Always — uploaded as a 14-day workflow artifact (the Actions-tab download path).
#   2. On push to main — overwrites a rolling **Latest build** GitHub Release so users can
#      grab the freshest APKs straight from the Releases page without needing a login or
#      navigating Actions.
#   3. On a `v*` tag — creates a regular named GitHub Release with the APKs attached.
#
# Build time on cold runner: ~5-8 min (downloads Android SDK + NDK r27 + Gradle deps). Warm
# runner with Gradle cache: ~2-3 min.

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # softprops/action-gh-release needs `contents: write` to create / update Releases.
    # `GITHUB_TOKEN` defaults to read-only on public repos for safety; grant write here.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # NDK 27 contains the toolchain our cpp/spake2_jni.cpp links against; CMake 3.22.1
          # matches the version pinned in app/src/main/cpp/CMakeLists.txt.
          ndk-version: '27.2.12479018'
          cmake-version: '3.22.1'
          accept-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: false

      - name: Build agent dex
        working-directory: app-project
        run: ./gradlew :agent:packageDex --no-daemon

      - name: Build release APKs (rokid + rayneo, R8-shrunk; ~3.4 MB each)
        working-directory: app-project
        run: ./gradlew :app:assembleRokidRelease :app:assembleRayneoRelease --no-daemon

      - name: List built APKs
        run: find app-project/app/build/outputs/apk -name '*.apk' -exec ls -lh {} \;

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: halo-ring-apks-${{ github.sha }}
          path: app-project/app/build/outputs/apk/**/*.apk
          retention-days: 14
          if-no-files-found: error

      # Stage the two release APKs with predictable names so the Release page shows clean
      # labels (`halo-ring-rokid-release.apk` etc.) instead of the Gradle output paths.
      - name: Stage APKs for release upload
        if: |
          (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
        run: |
          mkdir -p release-staging
          cp app-project/app/build/outputs/apk/rokid/release/app-rokid-release.apk   release-staging/halo-ring-rokid.apk
          cp app-project/app/build/outputs/apk/rayneo/release/app-rayneo-release.apk release-staging/halo-ring-rayneo.apk
          ls -lh release-staging/

      # Rolling "Latest build" Release — overwritten on every push to main so users always
      # have a one-click download path. Uses a fixed `latest` tag with prerelease=true so
      # GitHub's UI shows it below proper versioned releases when those exist.
      - name: Publish "Latest build" Release (push to main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build (main)
          body: |
            Auto-built APKs from the latest commit on `main`. Updated on every push.

            Commit: ${{ github.sha }} · Built: ${{ github.event.head_commit.timestamp }}

            ### Which APK do I want?

            - **Rokid Glasses** → `halo-ring-rokid.apk`
            - **RayNeo X3 Pro** → `halo-ring-rayneo.apk`

            Install via `adb install -r <apk>`; see the README for the full setup walk-through.

            For a specific version, see the [tagged releases](../releases) instead.
          files: release-staging/*.apk
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Versioned Release — created on a `v*` tag push. Same APKs, plus auto-generated
      # release notes from commit history.
      - name: Publish versioned Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-staging/*.apk
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

<?xml version="1.0" encoding="UTF-8"?>
<!-- V4 "Aurora" — V1 but the atmospheric halo is shifted to top-left (cx ≈ 0.35, cy ≈ 0.32),
     creating asymmetric lighting that matches the ring's linear gradient. Photographic / 3D feel,
     as if the ring is illuminated from one side. Most "scene"-like of the variants. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Asymmetric atmospheric halo, brighter top-left -->
    <radialGradient id="atmosphereHalo" cx="0.35" cy="0.32" r="0.65">
      <stop offset="0.40" stop-color="#7BEDA8" stop-opacity="0.32"/>
      <stop offset="0.62" stop-color="#5EE08C" stop-opacity="0.16"/>
      <stop offset="0.85" stop-color="#5EE08C" stop-opacity="0.04"/>
      <stop offset="1.0"  stop-color="#5EE08C" stop-opacity="0"/>
    </radialGradient>
    <!-- Asymmetric rim glow, biased toward the top-left -->
    <radialGradient id="rimGlow" cx="0.42" cy="0.38" r="0.5">
      <stop offset="0.80" stop-color="#5EE08C" stop-opacity="0"/>
      <stop offset="0.88" stop-color="#9CF2C0" stop-opacity="0.5"/>
      <stop offset="0.93" stop-color="#5EE08C" stop-opacity="0.18"/>
      <stop offset="1.0"  stop-color="#5EE08C" stop-opacity="0"/>
    </radialGradient>
    <!-- Same metallic linear gradient -->
    <linearGradient id="ringMetal" x1="0.2" y1="0.15" x2="0.85" y2="0.95">
      <stop offset="0"   stop-color="#9CF2C0"/>
      <stop offset="0.5" stop-color="#5EE08C"/>
      <stop offset="1"   stop-color="#3FB872"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="#000000"/>
  <!-- Note: halo circles use the asymmetric gradients centered as specified above. -->
  <circle cx="512" cy="512" r="520" fill="url(#atmosphereHalo)"/>
  <circle cx="512" cy="512" r="340" fill="url(#rimGlow)"/>

  <path fill="url(#ringMetal)" fill-rule="evenodd" d="
    M 222 512 a 290 290 0 1 0 580 0 a 290 290 0 1 0 -580 0 Z
    M 282 512 a 230 230 0 1 1 460 0 a 230 230 0 1 1 -460 0 Z
  "/>
</svg>

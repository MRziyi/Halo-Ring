<?xml version="1.0" encoding="UTF-8"?>
<!--
  Halo Ring · 环意 — master icon design at 1024 × 1024
  Brand: by Zack 紫意
  Palette: #000 background, #5EE08C accent (+ lighter/darker stops for ring depth)
  Design notes: see /Users/Zack/Code/Projects/R08-dev/Doc/brand/README.md
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Atmospheric halo: soft outer glow extending past the ring.
         The "Halo" of Halo Ring — what makes the ring look like it's lit in the dark. -->
    <radialGradient id="atmosphereHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.55" stop-color="#5EE08C" stop-opacity="0"/>
      <stop offset="0.62" stop-color="#5EE08C" stop-opacity="0.22"/>
      <stop offset="0.78" stop-color="#5EE08C" stop-opacity="0.06"/>
      <stop offset="1.0"  stop-color="#5EE08C" stop-opacity="0"/>
    </radialGradient>

    <!-- Tight rim glow: bright band right at the ring's edge.
         Gives the ring a hot inner perimeter — like a fresh LED catching the dark. -->
    <radialGradient id="rimGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.83" stop-color="#5EE08C" stop-opacity="0"/>
      <stop offset="0.87" stop-color="#5EE08C" stop-opacity="0.55"/>
      <stop offset="0.93" stop-color="#5EE08C" stop-opacity="0.10"/>
      <stop offset="1.0"  stop-color="#5EE08C" stop-opacity="0"/>
    </radialGradient>

    <!-- Ring fill: linear gradient simulating light from the top-left.
         Top-left bright (#9CF2C0) → center (#5EE08C) → bottom-right dark (#3FB872).
         This is the only "skeuomorphic" touch — gives the otherwise flat annulus
         a sense of physical depth, like real jewelry. -->
    <linearGradient id="ringMetal" x1="0.2" y1="0.15" x2="0.85" y2="0.95">
      <stop offset="0"   stop-color="#9CF2C0"/>
      <stop offset="0.5" stop-color="#5EE08C"/>
      <stop offset="1"   stop-color="#3FB872"/>
    </linearGradient>
  </defs>

  <!-- Pure black background -->
  <rect width="1024" height="1024" fill="#000000"/>

  <!-- Layer 1: atmospheric halo (outermost glow, fills most of canvas) -->
  <circle cx="512" cy="512" r="480" fill="url(#atmosphereHalo)"/>

  <!-- Layer 2: tight rim glow (right at the ring edge) -->
  <circle cx="512" cy="512" r="320" fill="url(#rimGlow)"/>

  <!-- Layer 3: the ring itself.
       Drawn as a single path: outer circle CCW + inner circle CW, evenodd fill rule
       produces the annulus (donut) shape from the gradient. -->
  <path fill="url(#ringMetal)" fill-rule="evenodd" d="
    M 222 512
    a 290 290 0 1 0 580 0
    a 290 290 0 1 0 -580 0
    Z
    M 282 512
    a 230 230 0 1 1 460 0
    a 230 230 0 1 1 -460 0
    Z
  "/>
</svg>

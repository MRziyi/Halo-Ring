<?xml version="1.0" encoding="UTF-8"?>
<!-- V5 "Twin" — V1 + a thinner outer ring at 1.18× radius.
     Two-ring composition (cf. AirPods Pro / Pixel 8 / Linear icons). Adds rhythm,
     suggests orbit / multi-band system. Reads as "more deliberate / designed" without
     adding new colors or decorative elements. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="atmosphereHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.55" stop-color="#5EE08C" stop-opacity="0"/>
      <stop offset="0.62" stop-color="#5EE08C" stop-opacity="0.20"/>
      <stop offset="0.78" stop-color="#5EE08C" stop-opacity="0.05"/>
      <stop offset="1.0"  stop-color="#5EE08C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rimGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.83" stop-color="#5EE08C" stop-opacity="0"/>
      <stop offset="0.87" stop-color="#5EE08C" stop-opacity="0.5"/>
      <stop offset="0.93" stop-color="#5EE08C" stop-opacity="0.08"/>
      <stop offset="1.0"  stop-color="#5EE08C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringMetal" x1="0.2" y1="0.15" x2="0.85" y2="0.95">
      <stop offset="0"   stop-color="#9CF2C0"/>
      <stop offset="0.5" stop-color="#5EE08C"/>
      <stop offset="1"   stop-color="#3FB872"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="#000000"/>
  <circle cx="512" cy="512" r="480" fill="url(#atmosphereHalo)"/>
  <circle cx="512" cy="512" r="320" fill="url(#rimGlow)"/>

  <!-- Main ring (same as V1) -->
  <path fill="url(#ringMetal)" fill-rule="evenodd" d="
    M 222 512 a 290 290 0 1 0 580 0 a 290 290 0 1 0 -580 0 Z
    M 282 512 a 230 230 0 1 1 460 0 a 230 230 0 1 1 -460 0 Z
  "/>

  <!-- Outer thin halo-ring at r=340 (about 1.17× main ring's outer radius).
       Stroke 6 px. Opacity 0.55 so it's visible but doesn't compete with the main ring. -->
  <circle cx="512" cy="512" r="340" fill="none"
          stroke="#5EE08C" stroke-width="6" opacity="0.55"/>
</svg>
